name: Chrome GUI with Xpra

on:
  workflow_dispatch:

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # Xpra from the official repo (v6.x) — the Ubuntu-repo version is too old
      # and its HTML5 client has broken clipboard support and poor audio.
      # Extra packages: x11-xkb-utils (Hebrew keymap), pcmanfm (file manager),
      # xdg-utils (so "show in folder"/open works), locales (Hebrew locale).
      - name: Install Xpra 6 + audio + Hebrew + file tools
        run: |
          sudo wget -q -O /usr/share/keyrings/xpra.asc https://xpra.org/xpra.asc
          sudo wget -q -O /etc/apt/sources.list.d/xpra.sources \
            https://raw.githubusercontent.com/Xpra-org/xpra/master/packaging/repos/noble/xpra.sources
          sudo apt-get update
          sudo apt-get install -y \
            xpra xpra-x11 xpra-html5 xpra-audio-server xpra-codecs \
            pulseaudio pulseaudio-utils dbus-x11 \
            gstreamer1.0-pulseaudio gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools \
            fonts-noto-core fonts-noto-color-emoji fonts-liberation culmus \
            x11-xkb-utils pcmanfm xdg-utils locales
          sudo locale-gen he_IL.UTF-8 || true

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      # Chrome profile: Hebrew UI language, Hebrew as top accept-language (so
      # Chrome offers to translate non-Hebrew pages to Hebrew), and a fixed
      # download directory with no "save as" prompt.
      - name: Configure Chrome (Hebrew + translate + downloads)
        run: |
          mkdir -p "$HOME/Downloads"
          mkdir -p "$HOME/.config/google-chrome/Default"
          printf '%s' '{"intl":{"accept_languages":"he,he-IL,en-US,en","selected_languages":"he,he-IL,en-US,en"},"translate":{"enabled":true},"browser":{"has_seen_welcome_page":true},"download":{"default_directory":"/home/runner/Downloads","prompt_for_download":false,"directory_upgrade":true}}' \
            > "$HOME/.config/google-chrome/Default/Preferences"
          # make pcmanfm the default handler for folders so Chrome "show in folder" works
          xdg-mime default pcmanfm.desktop inode/directory 2>/dev/null || true

      # NOTE: xpra's default port 14500 is already taken on the runner by a
      # systemd-activated xpra.socket, so binding it fails ("Address already in
      # use") and the whole server dies -> Cloudflare shows 502. We bind 41234.
      #
      # Google Chrome is preinstalled on the runner. The apt "chromium-browser"
      # package is a snap, and snap confinement breaks the PulseAudio connection
      # under xpra (= no sound), so we use Chrome instead.
      #
      # file-transfer/open-files/open-url = on  -> the html5 client's Server menu
      # can send files to your computer and receive uploads. pcmanfm is launched
      # via --start (not start-child, so closing it doesn't end the session) to
      # give a real file manager for the Downloads folder.
      - name: Start Xpra
        run: |
          export LANG=he_IL.UTF-8
          export LANGUAGE=he_IL:he
          mkdir -p "$HOME/Downloads"

          xpra start :100 \
            --bind-tcp=0.0.0.0:41234 \
            --html=on \
            --daemon=yes \
            --exit-with-children=yes \
            --pulseaudio=yes \
            --speaker=yes \
            --speaker-codec=mp3 \
            --microphone=no \
            --clipboard=yes \
            --clipboard-direction=both \
            --file-transfer=yes \
            --open-files=yes \
            --open-url=yes \
            --webcam=no \
            --mdns=no \
            --notifications=yes \
            --bell=no \
            --quality=50 \
            --min-quality=20 \
            --start="pcmanfm /home/runner/Downloads" \
            --start-child="google-chrome \
              --lang=he \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-sync \
              --disable-background-networking \
              --disable-background-timer-throttling \
              --disable-renderer-backgrounding \
              --disable-component-update \
              --disable-features=BackForwardCache \
              --no-first-run \
              --no-default-browser-check \
              --autoplay-policy=no-user-gesture-required \
              --renderer-process-limit=2 \
              --window-size=854,480"

          # wait until the HTML5 server actually answers
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:41234 && break
            sleep 2
          done

          # Hebrew keyboard layout with Alt+Shift toggle (English <-> Hebrew)
          DISPLAY=:100 setxkbmap -layout "us,il" -option "grp:alt_shift_toggle" 2>/dev/null || true
          echo "Xpra is up."

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --no-autoupdate \
            --url http://localhost:41234 \
            > tunnel.log 2>&1 &

          # poll for the URL instead of a fixed sleep
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o "https://[-a-zA-Z0-9.]*trycloudflare.com" tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Tunnel failed to start:"
            cat tunnel.log
            exit 1
          fi

          # שמע חד-כיווני בלבד: הרמקול (שרת->דפדפן) עובד. מיקרופון (דפדפן->שרת)
          # לא נתמך בלקוח ה-HTML5 של xpra. לוח טקסט עובד לשני הכיוונים.
          FULL="${URL}/?sound=on&audio_codec=mp3&clipboard=on"

          echo "=============================================================="
          echo " OPEN THIS URL (speaker audio + clipboard + Hebrew):"
          echo " ${FULL}"
          echo "=============================================================="

          # נשמר כ-artifact כדי שהסקריפט/EXE יוכל למשוך אותו ב-API בזמן אמת
          echo "${FULL}" > "${GITHUB_WORKSPACE}/tunnel_url.txt"

      - name: Publish tunnel URL
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-url
          path: tunnel_url.txt
          retention-days: 1

      - name: Keep Alive
        run: sleep 20400   # ~5h40m, stays under GitHub's 6-hour job limit
