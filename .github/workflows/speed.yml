name: DIAG speed
on:
  workflow_dispatch:
jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Runner internet speed + latency
        run: |
          {
            echo "===== runner egress IP / geo ====="
            curl -s https://ipinfo.io/json | tr -d '\n' ; echo
            echo "===== DOWNLOAD speed (Cloudflare 100MB) ====="
            curl -s -o /dev/null -w "dl_bytes=%{size_download} time=%{time_total}s speed=%{speed_download} B/s\n" \
              "https://speed.cloudflare.com/__down?bytes=100000000"
            echo "===== UPLOAD speed (Cloudflare 25MB) ====="
            head -c 25000000 /dev/zero > /tmp/up.bin
            curl -s -o /dev/null -w "ul_time=%{time_total}s speed=%{speed_upload} B/s\n" \
              -X POST --data-binary @/tmp/up.bin "https://speed.cloudflare.com/__up"
            echo "===== latency to cloudflare edge (ping) ====="
            ping -c 5 speed.cloudflare.com 2>&1 | tail -3 || true
            echo "===== latency to a few sites ====="
            for h in www.google.com github.com youtube.com; do
              ping -c 3 "$h" 2>&1 | tail -1 | sed "s/^/$h /" || true
            done
          } > speed.txt 2>&1
          cat speed.txt

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed
          path: speed.txt
          retention-days: 1
