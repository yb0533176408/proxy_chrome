name: DIAG xpra
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Xpra 6 + audio stack
        run: |
          sudo wget -q -O /usr/share/keyrings/xpra.asc https://xpra.org/xpra.asc
          sudo wget -q -O /etc/apt/sources.list.d/xpra.sources \
            https://raw.githubusercontent.com/Xpra-org/xpra/master/packaging/repos/noble/xpra.sources
          sudo apt-get update
          sudo apt-get install -y \
            xpra xpra-x11 xpra-html5 xpra-audio-server xpra-codecs \
            pulseaudio pulseaudio-utils dbus-x11 \
            gstreamer1.0-pulseaudio gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools \
            fonts-noto-core fonts-noto-color-emoji fonts-liberation culmus \
            2>&1 | tail -n 20

      - name: Probe environment (before)
        run: |
          {
            echo "===== OS ====="
            lsb_release -a 2>/dev/null || cat /etc/os-release
            echo "===== chrome binaries ====="
            which google-chrome google-chrome-stable chromium-browser chromium 2>&1 || true
            google-chrome --version 2>&1 || echo "google-chrome: NOT runnable"
            echo "===== xpra version ====="
            xpra --version 2>&1 || true
            echo "===== pulseaudio ====="
            which pulseaudio pactl 2>&1 || true
          } > env_before.txt 2>&1
          cat env_before.txt

      - name: Start xpra (daemon=no, backgrounded) + audio both directions
        run: |
          sudo apt-get install -y iproute2 >/dev/null 2>&1 || true
          echo "===== WHO holds 14500 (default xpra port) ====="
          sudo ss -ltnp 2>/dev/null | grep -E ':14500' || echo "14500 free"
          echo "===== is 41234 free? ====="
          sudo ss -ltnp 2>/dev/null | grep -E ':41234' || echo "41234 free"

          # bind our session to a NON-default port to avoid the system xpra on 14500
          xpra start :100 \
            --bind-tcp=0.0.0.0:41234 \
            --html=on \
            --daemon=no \
            --exit-with-children=no \
            --pulseaudio=yes \
            --speaker=yes \
            --speaker-codec=mp3 \
            --microphone=yes \
            --clipboard=yes \
            --clipboard-direction=both \
            --webcam=no --mdns=no --notifications=no --bell=no \
            --quality=50 --min-quality=20 \
            --start-child="google-chrome \
              --no-sandbox --disable-dev-shm-usage --disable-extensions \
              --disable-sync --disable-background-networking \
              --disable-background-timer-throttling --disable-renderer-backgrounding \
              --disable-component-update --disable-features=Translate,BackForwardCache \
              --no-first-run --no-default-browser-check \
              --autoplay-policy=no-user-gesture-required \
              --renderer-process-limit=2 --window-size=854,480" \
            > xpra_stdout.txt 2>&1 &
          XPID=$!
          echo "xpra pid=$XPID"

          # wait for HTML5 server to answer
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:41234 && { echo "HTML5 up after ${i}x2s"; break; }
            sleep 2
          done

          echo "===== listeners AFTER xpra (41234) ====="
          sudo ss -ltnp 2>/dev/null | grep -E ':41234' || echo "nothing on 41234"
          echo "===== curl code ====="
          curl -s -o /dev/null -w "http_code=%{http_code}\n" http://localhost:41234 || true

      - name: Collect diagnostics (after)
        if: always()
        run: |
          {
            echo "===== curl localhost:14500 ====="
            curl -s -o /dev/null -w "http_code=%{http_code}\n" http://localhost:14500 || echo "curl FAILED"
            echo "===== processes ====="
            ps aux | grep -Ei 'xpra|chrome|pulse|Xvfb|Xorg' | grep -v grep || true
            echo "===== xpra list ====="
            xpra list 2>&1 || true
            echo "===== xpra info (audio/child/error) ====="
            xpra info :100 2>&1 | grep -Ei 'child|command|exit|error|speaker|microphone|sound|audio|clipboard' | head -n 80 || true
            echo "===== pactl info ====="
            pactl info 2>&1 || echo "pactl failed"
            echo "===== pactl list sinks short ====="
            pactl list short sinks 2>&1 || true
          } > diag_after.txt 2>&1
          cat diag_after.txt

          echo "===== xpra_stdout.txt =====" > server_logs.txt
          cat xpra_stdout.txt >> server_logs.txt 2>/dev/null || true
          echo "===== xpra server.log =====" >> server_logs.txt
          for f in $(find /run/user ~/.xpra -name '*.log' 2>/dev/null); do
            echo "----- $f -----" >> server_logs.txt
            cat "$f" >> server_logs.txt
          done
          echo "===== speaker/mic in xpra info =====" >> server_logs.txt
          xpra info :100 2>/dev/null | grep -Ei 'speaker|microphone|sound|audio|clipboard' | head -60 >> server_logs.txt || true
          echo "===== chrome running? =====" >> server_logs.txt
          ps aux | grep -Ei 'chrome' | grep -v grep | head -5 >> server_logs.txt || true
          cat server_logs.txt || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: |
            env_before.txt
            diag_after.txt
            server_logs.txt
          retention-days: 1
          if-no-files-found: warn
