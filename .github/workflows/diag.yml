name: DIAG xpra
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install
        run: |
          sudo wget -q -O /usr/share/keyrings/xpra.asc https://xpra.org/xpra.asc
          sudo wget -q -O /etc/apt/sources.list.d/xpra.sources \
            https://raw.githubusercontent.com/Xpra-org/xpra/master/packaging/repos/noble/xpra.sources
          sudo apt-get update
          sudo apt-get install -y \
            xpra xpra-x11 xpra-html5 xpra-audio-server xpra-codecs \
            pulseaudio pulseaudio-utils dbus-x11 \
            gstreamer1.0-pulseaudio gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly gstreamer1.0-tools \
            fonts-noto-core fonts-noto-color-emoji fonts-liberation culmus \
            x11-xkb-utils pcmanfm xdg-utils locales iproute2 2>&1 | tail -n 5
          sudo locale-gen he_IL.UTF-8 || true

      - name: Configure Chrome
        run: |
          mkdir -p "$HOME/Downloads" "$HOME/.config/google-chrome/Default"
          printf '%s' '{"intl":{"accept_languages":"he,he-IL,en-US,en"},"translate":{"enabled":true},"download":{"default_directory":"/home/runner/Downloads","prompt_for_download":false}}' \
            > "$HOME/.config/google-chrome/Default/Preferences"
          xdg-mime default pcmanfm.desktop inode/directory 2>/dev/null || true

      - name: Start xpra (daemon=no) with ALL new options
        run: |
          export LANG=he_IL.UTF-8
          export LANGUAGE=he_IL:he
          mkdir -p "$HOME/Downloads"
          xpra start :100 \
            --bind-tcp=0.0.0.0:41234 \
            --html=on --daemon=no --exit-with-children=no \
            --pulseaudio=yes --speaker=yes --speaker-codec=mp3 --microphone=no \
            --clipboard=yes --clipboard-direction=both \
            --file-transfer=yes --open-files=yes --open-url=yes \
            --webcam=no --mdns=no --notifications=yes --bell=no \
            --quality=50 --min-quality=20 \
            --start="pcmanfm /home/runner/Downloads" \
            --start-child="google-chrome --lang=he --no-sandbox --disable-dev-shm-usage \
              --disable-sync --disable-background-networking --disable-component-update \
              --disable-features=BackForwardCache --no-first-run --no-default-browser-check \
              --autoplay-policy=no-user-gesture-required --renderer-process-limit=2 --window-size=854,480" \
            > xpra_stdout.txt 2>&1 &
          echo "xpra bg pid=$!"
          for i in $(seq 1 40); do
            curl -s -o /dev/null http://localhost:41234 && { echo "HTML5 up (${i})"; break; }
            sleep 2
          done
          DISPLAY=:100 setxkbmap -layout "us,il" -option "grp:alt_shift_toggle" 2>&1 || echo "setxkbmap rc=$?"
          sleep 8

      - name: Collect
        if: always()
        run: |
          {
            echo "===== curl code ====="
            curl -s -o /dev/null -w "http_code=%{http_code}\n" http://localhost:41234 || echo curl-fail
            echo "===== 41234 listener ====="
            sudo ss -ltnp 2>/dev/null | grep 41234 || echo "nothing on 41234"
            echo "===== processes ====="
            ps aux | grep -Ei 'xpra|chrome|pcmanfm|pulse' | grep -v grep | head -20
            echo "===== keymap ====="
            DISPLAY=:100 setxkbmap -query 2>&1 || true
            echo "===== xpra info: file/clip/audio ====="
            xpra info :100 2>/dev/null | grep -Ei 'file-transfer|open-files|open-url|speaker|clipboard.can|audio.initialized' | head -40
          } > diag.txt 2>&1
          cat diag.txt
          echo "===== xpra_stdout (errors) =====" > logs.txt
          cat xpra_stdout.txt >> logs.txt 2>/dev/null || true
          grep -Ei 'error|warn|invalid|unknown|not found|fail' xpra_stdout.txt | head -40 || true
          echo "----- server.log -----" >> logs.txt
          for f in $(find /run/user ~/.xpra -name '*.log' 2>/dev/null); do echo "## $f" >> logs.txt; cat "$f" >> logs.txt; done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: |
            diag.txt
            logs.txt
          retention-days: 1
          if-no-files-found: warn
