name: DIAG lt
on:
  workflow_dispatch:
jobs:
  lt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: start origin + tunnels
        run: |
          python3 -m http.server 41234 >/dev/null 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "origin http=%{http_code}\n" http://localhost:41234 || true

          echo "== localtunnel =="
          npm install -g localtunnel >/dev/null 2>&1 || sudo npm install -g localtunnel >/dev/null 2>&1 || true
          nohup lt --port 41234 > lt.log 2>&1 &
          for i in $(seq 1 20); do
            LT=$(grep -o "https://[-a-z0-9]*\.loca\.lt" lt.log | head -1)
            [ -n "$LT" ] && break; sleep 2
          done

          echo "== serveo =="
          nohup ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -R 80:localhost:41234 serveo.net > serveo.log 2>&1 &
          for i in $(seq 1 15); do
            SV=$(grep -oE "https://[-a-z0-9]*\.serveo\.net" serveo.log | head -1)
            [ -n "$SV" ] && break; sleep 2
          done

          IP=$(curl -s https://loca.lt/mytunnelpassword)
          {
            echo "LT_URL=$LT"
            echo "SERVEO_URL=$SV"
            echo "TUNNEL_PASSWORD_IP=$IP"
          } | tee "${GITHUB_WORKSPACE}/result.txt"
          echo "--- lt.log ---"; head -5 lt.log
          echo "--- serveo.log ---"; head -8 serveo.log

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lt
          path: result.txt
          retention-days: 1
          if-no-files-found: warn

      - name: keep alive
        run: sleep 540
